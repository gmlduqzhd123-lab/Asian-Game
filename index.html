<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>엽쌤의 아시안게임 체육 수업 🏆</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: white; touch-action: manipulation; overflow-x: hidden; }
        .font-black-han { font-family: 'Black Han Sans', sans-serif; }
        .hidden-tab { display: none !important; }

        /* 모바일 환경 대응: 카드 높이를 유동적으로 조정하고 내부 스크롤 허용 */
        .flip-container { perspective: 1000px; width: 100%; max-width: 800px; height: 65vh; min-height: 500px; max-height: 650px; margin: 0 auto; }
        .flipper { transition: 0.8s; transform-style: preserve-3d; position: relative; width: 100%; height: 100%; }
        .flip-container.flip .flipper { transform: rotateY(180deg); }
        .front, .back { backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 1.5rem; overflow-y: auto; overflow-x: hidden; }
        .front { z-index: 2; transform: rotateY(0deg); }
        .back { transform: rotateY(180deg); }

        @keyframes bounceIn { 0% { transform: scale(0.1); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
        .bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pulseRed { 0%, 100% { color: #f87171; text-shadow: 0 0 10px #f87171; } 50% { color: #ffffff; text-shadow: none; } }
        .timer-warning { animation: pulseRed 1s infinite; }
        
        @keyframes floatAction { 
            0% { transform: translateY(0px) scale(1); } 
            50% { transform: translateY(-8px) scale(1.03); } 
            100% { transform: translateY(0px) scale(1); } 
        }
        .action-anim { animation: floatAction 2.5s ease-in-out infinite; }
        
        /* 세련된 커스텀 스크롤바 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; margin: 10px 0; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body class="flex flex-col h-screen relative">

    <!-- 🌟 저작권 문구 (화면 우측 하단 고정) -->
    <div class="fixed bottom-2 right-3 text-slate-500/70 text-xs md:text-sm font-bold z-50 pointer-events-none tracking-wide">
        ⓒ 2026. Made by. 엽쌤
    </div>

    <!-- 상단 네비게이션 -->
    <nav class="bg-slate-800 p-3 md:p-4 shadow-lg z-10 flex flex-col md:flex-row justify-between items-center gap-3 shrink-0 w-full">
        <div class="flex items-center gap-2 w-full md:w-auto justify-between md:justify-start">
            <button onclick="goHome()" class="text-lg md:text-2xl hover:scale-105 transition-transform bg-slate-700 p-2 rounded-lg border border-slate-600 shadow-md shrink-0" title="처음으로">🏠</button>
            <span class="text-sm md:text-xl font-black-han text-yellow-400 whitespace-nowrap hidden sm:inline shrink-0">🔥 오늘의 종목:</span>
            
            <select id="event-selector" onchange="changeSportEvent()" class="bg-slate-700 text-white text-xs sm:text-sm md:text-lg font-bold p-2 rounded-lg border-2 border-slate-500 focus:border-yellow-400 outline-none w-full max-w-[220px] sm:max-w-xs md:max-w-md truncate">
                <optgroup label="1. 표적/타겟형">
                    <option value="archery" selected>양궁 (훌라후프 과녁 던지기)</option>
                    <option value="golf">골프 (빗자루 교실 골프)</option>
                    <option value="shooting">사격 (종이컵 타겟 맞히기)</option>
                    <option value="basketball">농구 (휴지통 자유투)</option>
                </optgroup>
                <optgroup label="2. 네트/필드형">
                    <option value="teqball">테크볼 (책상 풍선 팡팡)</option>
                    <option value="volleyball">배구 (보자기 협동 배구)</option>
                    <option value="badminton">배드민턴 (풍선 셔틀콕)</option>
                    <option value="soccer">축구 (페트병 볼링 슈팅)</option>
                </optgroup>
                <optgroup label="3. 투기/경쟁형">
                    <option value="judo">유도 (안전 손바닥 밀치기)</option>
                    <option value="fencing">펜싱 (스펀지 검투사)</option>
                    <option value="taekwondo">태권도 (정확한 풍선 발차기)</option>
                </optgroup>
                <optgroup label="4. 기록/체력형">
                    <option value="weightlifting">역도 (플랭크/교과서 버티기)</option>
                    <option value="equestrian">승마 (훌라후프 2인 릴레이)</option>
                    <option value="hurdle">허들 (콘 뛰어넘기 달리기)</option>
                    <option value="longjump">멀리뛰기 (제자리 릴레이)</option>
                </optgroup>
                <optgroup label="5. 레이스/릴레이형">
                    <option value="relay">육상 (숟가락 성화 달리기)</option>
                    <option value="swimming">수영 (스쿠터보드 릴레이)</option>
                    <option value="rowing">조정 (앉아서 밧줄 당기기)</option>
                </optgroup>
                <optgroup label="6. 표현/예술형">
                    <option value="gymnastics">체조 (휴지 리본 댄스)</option>
                    <option value="breaking">브레이킹 (포즈 프리즈)</option>
                </optgroup>
            </select>
        </div>
        <div class="flex gap-1 sm:gap-2 md:gap-4 w-full md:w-auto justify-between md:justify-end">
            <button onclick="switchTab('mission')" id="btn-mission" class="tab-btn flex-1 md:flex-none px-2 sm:px-4 py-2 rounded-lg font-bold text-xs sm:text-sm md:text-xl bg-blue-600 hover:bg-blue-500 transition shadow whitespace-nowrap">🎬 미션</button>
            <button onclick="switchTab('roulette')" id="btn-roulette" class="tab-btn flex-1 md:flex-none px-2 sm:px-4 py-2 rounded-lg font-bold text-xs sm:text-sm md:text-xl bg-slate-700 hover:bg-slate-600 transition shadow whitespace-nowrap">🎲 역할</button>
            <button onclick="switchTab('scoreboard')" id="btn-scoreboard" class="tab-btn flex-1 md:flex-none px-2 sm:px-4 py-2 rounded-lg font-bold text-xs sm:text-sm md:text-xl bg-slate-700 hover:bg-slate-600 transition shadow whitespace-nowrap">🎯 점수</button>
        </div>
    </nav>

    <!-- 1. 미션 룸 -->
    <section id="tab-mission" class="flex-1 p-3 md:p-6 flex flex-col items-center justify-center relative overflow-y-auto">
        <h1 class="text-2xl md:text-4xl font-black-han text-yellow-400 mb-3 md:mb-5 tracking-wider text-center shrink-0">오늘의 스포츠 미션 알아보기!</h1>
        
        <div class="flip-container shrink-0 w-full" id="mission-card">
            <div class="flipper shadow-2xl">
                <!-- 앞면: 유튜브 링크 화면 -->
                <div class="front bg-slate-800 flex flex-col border-4 border-slate-600 custom-scrollbar relative justify-between">
                    <div class="bg-slate-900 p-2 md:p-3 flex justify-between items-center border-b border-slate-700 shrink-0">
                        <span class="text-xl md:text-2xl ml-2">💡</span>
                        <span class="text-slate-300 font-bold text-xs md:text-base">리드업 게임 규칙 안내</span>
                        <span class="text-xl md:text-2xl mr-2">💡</span>
                    </div>
                    
                    <div class="flex-1 flex flex-col items-center justify-center p-4 w-full mt-2 shrink-0">
                        <div id="anim-icon" class="text-[5rem] md:text-[7rem] action-anim drop-shadow-[0_0_30px_rgba(255,255,255,0.3)] mb-2 shrink-0">🎯</div>
                        <h2 id="anim-title" class="text-2xl sm:text-3xl md:text-4xl font-black-han text-white tracking-widest drop-shadow-lg mb-3 text-center break-keep w-full shrink-0">양궁 (훌라후프)</h2>
                        <p id="anim-guide" class="text-slate-300 font-bold text-sm md:text-lg text-center bg-black/40 px-4 md:px-6 py-2 md:py-3 rounded-full border border-slate-600 w-11/12 max-w-lg break-keep shrink-0 shadow-inner">준비선에 서서 과녁을 조준하세요!</p>
                    </div>

                    <!-- 📺 버튼 태그. 유튜브 즉시 강제 재생 -->
                    <div class="w-full bg-slate-900 p-4 border-t border-slate-700 flex flex-col gap-2 mt-auto shrink-0">
                        <h4 class="text-yellow-400 font-bold text-xs md:text-base mb-1 text-center">📺 관련 영상 (클릭 시 유튜브 즉시 재생)</h4>
                        <div id="youtube-links-container" class="flex flex-col gap-2">
                            <!-- JS 동적 생성 -->
                        </div>
                    </div>
                </div>

                <!-- 뒷면: 변형 게임 상세 설명 -->
                <div id="mission-back" class="back flex flex-col items-center justify-start text-center p-4 md:p-8 border-4 border-white bg-gradient-to-br from-blue-600 to-cyan-700 custom-scrollbar">
                    <span id="back-icon" class="text-[3rem] md:text-[5rem] mb-1 md:mb-2 drop-shadow-2xl shrink-0 mt-2">🏹</span>
                    <h3 id="mission-title" class="text-3xl md:text-4xl font-black-han text-yellow-300 drop-shadow-md tracking-widest mb-3 md:mb-5 break-keep shrink-0 border-b-2 border-white/30 pb-2 md:pb-4 w-full">훌라후프 양궁</h3>
                    
                    <div id="mission-desc" class="w-full max-w-2xl bg-black/40 rounded-2xl p-4 md:p-6 text-white text-left break-keep shadow-inner mb-4">
                        <!-- 세부 규칙 삽입 영역 -->
                    </div>
                </div>
            </div>
        </div>
        <!-- 💡 버튼 ID 부여 및 텍스트 동적 변경 설정 -->
        <button id="btn-flip" onclick="flipCard()" class="mt-4 md:mt-8 px-8 md:px-10 py-3 md:py-4 bg-yellow-500 hover:bg-yellow-400 text-black font-black-han text-xl md:text-3xl rounded-full shadow-[0_6px_0_rgb(202,138,4)] active:translate-y-2 active:shadow-none transition-all shrink-0">오늘의 미션 상세 보기! 🚀</button>
    </section>

    <!-- 2. 역할 뽑기 룰렛 -->
    <section id="tab-roulette" class="flex-1 hidden-tab p-4 md:p-8 flex flex-col items-center custom-scrollbar">
        <h1 class="text-2xl md:text-4xl font-black-han text-green-400 mb-4 tracking-wider text-center">🎲 종목 맞춤형 역할 뽑기</h1>
        <div class="w-full max-w-4xl bg-slate-800 p-4 md:p-6 rounded-2xl shadow-xl flex flex-col items-center shrink-0">
            <textarea id="student-names" oninput="saveStudentNames()" rows="3" class="w-full p-3 md:p-4 rounded-lg bg-slate-700 text-white border-2 border-slate-600 focus:border-green-400 outline-none text-sm md:text-xl mb-4 md:mb-6 custom-scrollbar" placeholder="우리 반 학생들 이름을 쉼표로 구분하여 입력하세요..."></textarea>
            <button onclick="startRoulette()" id="btn-start-roulette" class="w-full py-3 md:py-4 bg-green-500 hover:bg-green-400 text-black font-black-han text-xl md:text-3xl rounded-xl shadow-lg transition transform hover:scale-105">역할 섞기 시작! 🌪️</button>
        </div>
        <div id="roulette-display" class="mt-6 md:mt-8 text-3xl md:text-6xl font-black-han text-yellow-400 h-16 md:h-20 flex items-center justify-center text-center"></div>
        <div id="roulette-result" class="mt-4 md:mt-8 w-full max-w-6xl grid grid-cols-1 sm:grid-cols-3 gap-3 md:gap-6 hidden-tab pb-10"></div>
    </section>

    <!-- 3. 실시간 스코어보드 & 타이머 -->
    <section id="tab-scoreboard" class="flex-1 hidden-tab flex flex-col relative pb-4">
        <div class="w-full flex justify-between items-center px-4 md:px-8 py-3 md:py-4 absolute top-0 left-0 right-0 z-20">
            <h1 id="scoreboard-title" class="text-base sm:text-xl md:text-3xl font-black-han text-white drop-shadow-md bg-black/60 px-4 md:px-6 py-1 md:py-2 rounded-full border-2 border-slate-600 truncate max-w-[60%]">양궁 진행 중!</h1>
            <button onclick="resetScores()" class="px-2 py-1 md:px-4 md:py-2 bg-red-600 hover:bg-red-500 rounded font-bold shadow text-xs md:text-lg whitespace-nowrap">점수 초기화 🔄</button>
        </div>
        <div class="flex-1 flex flex-col sm:flex-row w-full mt-12 md:mt-0">
            <div class="flex-1 bg-blue-900 sm:border-r-4 border-b-4 sm:border-b-0 border-slate-900 flex flex-col items-center justify-center p-4 md:p-10 pt-16 md:pt-24 relative overflow-hidden">
                <span class="absolute text-[8rem] sm:text-[10rem] md:text-[15rem] opacity-10 left-4 md:left-10 top-10 md:top-20 pointer-events-none" id="bg-icon-A">🏹</span>
                <h2 class="text-2xl sm:text-3xl md:text-5xl font-black-han text-blue-300 mb-2 md:mb-8 z-10">청 군</h2>
                <div id="scoreA" class="text-6xl sm:text-8xl md:text-[10rem] lg:text-[12rem] font-black-han leading-none text-white drop-shadow-[0_0_20px_rgba(59,130,246,0.8)] mb-4 md:mb-8 transition-all z-10">0</div>
                <button onclick="addScore('A')" id="btn-score-A" class="z-10 w-11/12 md:w-4/5 h-14 sm:h-20 md:h-28 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-xl md:rounded-3xl text-xl sm:text-2xl md:text-4xl font-black-han shadow-[0_6px_0_rgb(30,58,138)] md:shadow-[0_8px_0_rgb(30,58,138)] active:translate-y-2 active:shadow-none transition-all">명중 +1</button>
            </div>
            <div class="flex-1 bg-red-900 flex flex-col items-center justify-center p-4 md:p-10 pt-4 sm:pt-16 md:pt-24 relative overflow-hidden">
                <span class="absolute text-[8rem] sm:text-[10rem] md:text-[15rem] opacity-10 right-4 md:right-10 top-4 sm:top-10 md:top-20 pointer-events-none" id="bg-icon-B">🏹</span>
                <h2 class="text-2xl sm:text-3xl md:text-5xl font-black-han text-red-300 mb-2 md:mb-8 z-10">백 군</h2>
                <div id="scoreB" class="text-6xl sm:text-8xl md:text-[10rem] lg:text-[12rem] font-black-han leading-none text-white drop-shadow-[0_0_20px_rgba(239,68,68,0.8)] mb-4 md:mb-8 transition-all z-10">0</div>
                <button onclick="addScore('B')" id="btn-score-B" class="z-10 w-11/12 md:w-4/5 h-14 sm:h-20 md:h-28 bg-red-600 hover:bg-red-500 active:bg-red-700 rounded-xl md:rounded-3xl text-xl sm:text-2xl md:text-4xl font-black-han shadow-[0_6px_0_rgb(127,29,29)] md:shadow-[0_8px_0_rgb(127,29,29)] active:translate-y-2 active:shadow-none transition-all">명중 +1</button>
            </div>
        </div>
        <!-- 타이머 패널 -->
        <div class="mt-3 md:mt-4 mx-auto w-[95%] max-w-4xl bg-slate-800 p-3 md:p-4 rounded-xl md:rounded-2xl border-2 md:border-4 border-slate-600 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-3 z-30 shrink-0">
            <span id="timer-display" class="text-4xl sm:text-5xl md:text-6xl font-black-han text-yellow-400 w-full sm:w-32 md:w-40 text-center shrink-0">00:00</span>
            <div class="flex flex-row w-full gap-2">
                <button onclick="startCountdown(15)" class="flex-1 py-2 md:py-3 bg-purple-600 hover:bg-purple-500 rounded-lg font-bold text-[10px] sm:text-xs md:text-lg whitespace-nowrap shadow">15초 타이머</button>
                <button onclick="startStopwatch()" class="flex-1 py-2 md:py-3 bg-green-600 hover:bg-green-500 rounded-lg font-bold text-[10px] sm:text-xs md:text-lg whitespace-nowrap shadow">기록 초시계</button>
                <button onclick="stopTimer()" class="flex-1 py-2 md:py-3 bg-red-600 hover:bg-red-500 rounded-lg font-bold text-[10px] sm:text-xs md:text-lg whitespace-nowrap shadow">정지/리셋</button>
            </div>
        </div>
    </section>

    <script>
        const colorMap = {
            red: { bg: 'bg-red-900/50', border: 'border-red-500', text: 'text-red-400' }, blue: { bg: 'bg-blue-900/50', border: 'border-blue-500', text: 'text-blue-400' },
            green: { bg: 'bg-green-900/50', border: 'border-green-500', text: 'text-green-400' }, yellow: { bg: 'bg-yellow-900/50', border: 'border-yellow-500', text: 'text-yellow-400' },
            purple: { bg: 'bg-purple-900/50', border: 'border-purple-500', text: 'text-purple-400' }, cyan: { bg: 'bg-cyan-900/50', border: 'border-cyan-500', text: 'text-cyan-400' },
            slate: { bg: 'bg-slate-800/80', border: 'border-slate-500', text: 'text-slate-300' }, pink: { bg: 'bg-pink-900/50', border: 'border-pink-500', text: 'text-pink-400' },
            orange: { bg: 'bg-orange-900/50', border: 'border-orange-500', text: 'text-orange-400' }
        };

        const ytBase = "https://www.youtube.com/watch?v=";

        // 20개 종목 데이터베이스 (에러 없는 1~2년 전 최신 링크)
        const sportEvents = {
            archery: { animIcon: "🎯", bgIcon: "🏹", title: "양궁 (훌라후프)", guideText: "준비선에 서서 과녁을 집중해서 조준하세요!", missionTitle: "훌라후프 양궁", bgColor: "from-yellow-600 to-red-700", roles: [{ name: "슈터 🏹", color: "red" }, { name: "기록원 📋", color: "blue" }, { name: "과녁정리 🎯", color: "yellow" }], scoreLabel: "명중 +1",
                youtubeLinks: [ { text: "🥇 파리 올림픽 양궁 김우진-임시현 금메달", url: ytBase+"2ZhK3XnUBZ4" }, { text: "🥇 파리 올림픽 양궁 남수아 등 하이라이트", url: ytBase+"3nB-m4BkA9c" } ],
                missionDesc: "<div class='space-y-3 text-sm sm:text-base font-medium leading-relaxed text-left px-2'><p>✅ <b>준비물:</b> 훌라후프 3개(대/중/소), 콩주머니(팀별 5개)</p><p>✅ <b>세팅:</b> 바닥에 훌라후프를 겹쳐 과녁을 만들고, 3m 거리에 투척선을 긋습니다.</p><p>✅ <b>진행:</b> 투척선 뒤에서 콩주머니를 던집니다. 팀원 모두 번갈아가며 던집니다.</p><p>✅ <b>점수:</b> 가장 안쪽 3점, 중간 2점, 바깥쪽 1점! 선을 밟고 던지면 0점입니다.</p></div>" },

        function startStopwatch() {
            clearInterval(timerInterval); timeCurrent = 0; isCountdown = false; updateTimerUI(timeCurrent);
            timerDisplay.classList.remove('timer-warning');
            timerInterval = setInterval(() => { timeCurrent++; updateTimerUI(timeCurrent); }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); timerDisplay.innerText = "00:00"; timerDisplay.classList.remove('timer-warning'); }
    </script>
</body>
</html>
